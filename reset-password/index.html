<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
  <title>重置密码 · ArticuLing</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <div class="brand" aria-hidden="true">A</div>
      <p class="eyebrow">ARTICULING ACCOUNT</p>
      <h1 id="page-title">重置密码</h1>
      <p class="lead">请在 ArticuLing 客户端中设置新密码。</p>
      <p class="secondary">Continue in the ArticuLing desktop app to reset your password.</p>
      <div id="status" class="status" data-tone="working" role="status">
        <span class="spinner" aria-hidden="true"></span>正在打开 ArticuLing……
      </div>
      <button id="open-app-button" class="primary-button action-button" type="button" hidden>打开 ArticuLing</button>
      <p class="hint action-hint">如果浏览器没有自动打开客户端，请点击上面的按钮。</p>
      <noscript><p class="status" data-tone="error">此页面需要启用 JavaScript 才能打开 ArticuLing。</p></noscript>
    </section>
  </main>
  <script type="module" src="./page.js"></script>
</body>
</html>
