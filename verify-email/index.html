<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.articuling.com http://127.0.0.1:8766 http://localhost:8766; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
  <title>验证邮箱 · ArticuLing</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <div class="brand" aria-hidden="true">A</div>
      <p class="eyebrow">ARTICULING ACCOUNT</p>
      <h1 id="page-title">验证邮箱</h1>
      <p class="lead">我们正在确认你的邮箱验证链接。</p>
      <p class="secondary">Verifying your email address.</p>
      <div id="status" class="status" data-tone="working" role="status">
        <span class="spinner" aria-hidden="true"></span>正在验证，请不要关闭页面……
      </div>
      <noscript><p class="status" data-tone="error">此页面需要启用 JavaScript 才能完成验证。</p></noscript>
    </section>
  </main>
  <script type="module" src="./page.js"></script>
</body>
</html>
